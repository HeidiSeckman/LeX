name: Build iOS App
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          mkdir -p ios-app && cd ios-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "LeX Social" "com.heidiseckman.lexsocial" --web-dir www
          mkdir -p www
          echo '<html><body style="background:#06060A;"></body></html>' > www/index.html
          npx cap add ios
          python3 -c 'import json; d=json.load(open("capacitor.config.json")); d["server"]={"url":"https:"+"//lexsocial.space","cleartext":False}; json.dump(d,open("capacitor.config.json","w"),indent=2)'
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/build/Payload" build
          cd build && zip -r LeXSocial.ipa Payload
      - name: Upload iOS App to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: "ios-app/build/LeXSocial.ipa"

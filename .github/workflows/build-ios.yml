
name: Build iOS App
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          mkdir -p ios-app && cd ios-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          mkdir -p www
          echo '<html><body style="background:#06060A;"></body></html>' > www/index.html
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.heidiseckman.lexsocial",
            "appName": "LeX Social",
            "webDir": "www",
            "server": {
              "url": "https://lexsocial.space",
              "cleartext": false
            }
          }
          EOF
          npx cap add ios
          sips -z 1024 1024 ../icon.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/build/Payload" build
          cd build && zip -r LeXSocial.ipa Payload
      - name: Upload iOS App to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: "ios-app/build/LeXSocial.ipa"
